<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="ChillMac — Stay cool, stay fast.">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3a4a"/>
      <stop offset="55%" stop-color="#0f2b3c"/>
      <stop offset="100%" stop-color="#0a1e2e"/>
    </linearGradient>
    <linearGradient id="ice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="tempBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="frost" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <symbol id="flake" viewBox="-10 -10 20 20" overflow="visible">
      <g stroke="#bae6fd" stroke-width="1.4" stroke-linecap="round" fill="none">
        <line x1="0" y1="-8" x2="0" y2="8"/>
        <line x1="-6.93" y1="-4" x2="6.93" y2="4"/>
        <line x1="-6.93" y1="4" x2="6.93" y2="-4"/>
        <line x1="0" y1="-8" x2="-2.2" y2="-5.5"/>
        <line x1="0" y1="-8" x2="2.2" y2="-5.5"/>
        <line x1="0" y1="8" x2="-2.2" y2="5.5"/>
        <line x1="0" y1="8" x2="2.2" y2="5.5"/>
      </g>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)" rx="20"/>
  <rect width="1200" height="320" fill="none" stroke="#2a5a6a" stroke-width="1" rx="20" opacity="0.55"/>

  <!-- Pulsing glow behind logo -->
  <circle cx="170" cy="160" r="155" fill="url(#glow)">
    <animate attributeName="r" values="135;175;135" dur="4.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75;1;0.75" dur="4.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Falling snowflakes (drift across full banner) -->
  <g opacity="0.85">
    <g><use href="#flake" width="14" height="14" x="-7" y="-7"/>
      <animateTransform attributeName="transform" type="translate" values="80,-30;110,360" dur="9s" repeatCount="indefinite" begin="-1s"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" from="0 0 0" to="360 0 0" dur="9s" repeatCount="indefinite" begin="-1s"/>
    </g>
    <g><use href="#flake" width="9" height="9" x="-4.5" y="-4.5"/>
      <animateTransform attributeName="transform" type="translate" values="220,-30;200,360" dur="11s" repeatCount="indefinite" begin="-4s"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" from="0 0 0" to="-360 0 0" dur="11s" repeatCount="indefinite" begin="-4s"/>
    </g>
    <g><use href="#flake" width="12" height="12" x="-6" y="-6"/>
      <animateTransform attributeName="transform" type="translate" values="380,-30;420,360" dur="8s" repeatCount="indefinite" begin="-2s"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite" begin="-2s"/>
    </g>
    <g><use href="#flake" width="8" height="8" x="-4" y="-4"/>
      <animateTransform attributeName="transform" type="translate" values="520,-30;500,360" dur="10s" repeatCount="indefinite" begin="0s"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite" begin="0s"/>
    </g>
    <g><use href="#flake" width="16" height="16" x="-8" y="-8"/>
      <animateTransform attributeName="transform" type="translate" values="640,-30;680,360" dur="12s" repeatCount="indefinite" begin="-6s"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" from="0 0 0" to="-360 0 0" dur="12s" repeatCount="indefinite" begin="-6s"/>
    </g>
    <g><use href="#flake" width="10" height="10" x="-5" y="-5"/>
      <animateTransform attributeName="transform" type="translate" values="760,-30;740,360" dur="9.5s" repeatCount="indefinite" begin="-3s"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" from="0 0 0" to="360 0 0" dur="9.5s" repeatCount="indefinite" begin="-3s"/>
    </g>
    <g><use href="#flake" width="11" height="11" x="-5.5" y="-5.5"/>
      <animateTransform attributeName="transform" type="translate" values="900,-30;940,360" dur="10.5s" repeatCount="indefinite" begin="-7s"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" from="0 0 0" to="-360 0 0" dur="10.5s" repeatCount="indefinite" begin="-7s"/>
    </g>
    <g><use href="#flake" width="8" height="8" x="-4" y="-4"/>
      <animateTransform attributeName="transform" type="translate" values="1060,-30;1030,360" dur="11.5s" repeatCount="indefinite" begin="-5s"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" from="0 0 0" to="360 0 0" dur="11.5s" repeatCount="indefinite" begin="-5s"/>
    </g>
    <g><use href="#flake" width="13" height="13" x="-6.5" y="-6.5"/>
      <animateTransform attributeName="transform" type="translate" values="1140,-30;1110,360" dur="8.5s" repeatCount="indefinite" begin="-2.5s"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" from="0 0 0" to="-360 0 0" dur="8.5s" repeatCount="indefinite" begin="-2.5s"/>
    </g>
    <g><use href="#flake" width="9" height="9" x="-4.5" y="-4.5"/>
      <animateTransform attributeName="transform" type="translate" values="300,-30;340,360" dur="10s" repeatCount="indefinite" begin="-8s"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite" begin="-8s"/>
    </g>
    <g><use href="#flake" width="7" height="7" x="-3.5" y="-3.5"/>
      <animateTransform attributeName="transform" type="translate" values="820,-30;800,360" dur="12.5s" repeatCount="indefinite" begin="-1.5s"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" from="0 0 0" to="-360 0 0" dur="12.5s" repeatCount="indefinite" begin="-1.5s"/>
    </g>
  </g>

  <!-- ChillMac fan/snowflake logo, slowly rotating -->
  <g transform="translate(170, 160)" filter="url(#shadow)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      <g transform="scale(0.42)">
        <g transform="rotate(0)">
          <line x1="0" y1="-60" x2="0" y2="-280" stroke="url(#ice)" stroke-width="28" stroke-linecap="round"/>
          <path d="M 0,-80 Q 80,-160 30,-260" stroke="url(#ice)" stroke-width="20" fill="none" stroke-linecap="round"/>
          <line x1="0" y1="-180" x2="-45" y2="-230" stroke="url(#ice)" stroke-width="12" stroke-linecap="round"/>
          <line x1="0" y1="-180" x2="45" y2="-230" stroke="url(#ice)" stroke-width="12" stroke-linecap="round"/>
          <circle cx="0" cy="-285" r="14" fill="#bae6fd"/>
        </g>
        <g transform="rotate(60)">
          <line x1="0" y1="-60" x2="0" y2="-280" stroke="url(#ice)" stroke-width="28" stroke-linecap="round"/>
          <path d="M 0,-80 Q 80,-160 30,-260" stroke="url(#ice)" stroke-width="20" fill="none" stroke-linecap="round"/>
          <line x1="0" y1="-180" x2="-45" y2="-230" stroke="url(#ice)" stroke-width="12" stroke-linecap="round"/>
          <line x1="0" y1="-180" x2="45" y2="-230" stroke="url(#ice)" stroke-width="12" stroke-linecap="round"/>
          <circle cx="0" cy="-285" r="14" fill="#bae6fd"/>
        </g>
        <g transform="rotate(120)">
          <line x1="0" y1="-60" x2="0" y2="-280" stroke="url(#ice)" stroke-width="28" stroke-linecap="round"/>
          <path d="M 0,-80 Q 80,-160 30,-260" stroke="url(#ice)" stroke-width="20" fill="none" stroke-linecap="round"/>
          <line x1="0" y1="-180" x2="-45" y2="-230" stroke="url(#ice)" stroke-width="12" stroke-linecap="round"/>
          <line x1="0" y1="-180" x2="45" y2="-230" stroke="url(#ice)" stroke-width="12" stroke-linecap="round"/>
          <circle cx="0" cy="-285" r="14" fill="#bae6fd"/>
        </g>
        <g transform="rotate(180)">
          <line x1="0" y1="-60" x2="0" y2="-280" stroke="url(#ice)" stroke-width="28" stroke-linecap="round"/>
          <path d="M 0,-80 Q 80,-160 30,-260" stroke="url(#ice)" stroke-width="20" fill="none" stroke-linecap="round"/>
          <line x1="0" y1="-180" x2="-45" y2="-230" stroke="url(#ice)" stroke-width="12" stroke-linecap="round"/>
          <line x1="0" y1="-180" x2="45" y2="-230" stroke="url(#ice)" stroke-width="12" stroke-linecap="round"/>
          <circle cx="0" cy="-285" r="14" fill="#bae6fd"/>
        </g>
        <g transform="rotate(240)">
          <line x1="0" y1="-60" x2="0" y2="-280" stroke="url(#ice)" stroke-width="28" stroke-linecap="round"/>
          <path d="M 0,-80 Q 80,-160 30,-260" stroke="url(#ice)" stroke-width="20" fill="none" stroke-linecap="round"/>
          <line x1="0" y1="-180" x2="-45" y2="-230" stroke="url(#ice)" stroke-width="12" stroke-linecap="round"/>
          <line x1="0" y1="-180" x2="45" y2="-230" stroke="url(#ice)" stroke-width="12" stroke-linecap="round"/>
          <circle cx="0" cy="-285" r="14" fill="#bae6fd"/>
        </g>
        <g transform="rotate(300)">
          <line x1="0" y1="-60" x2="0" y2="-280" stroke="url(#ice)" stroke-width="28" stroke-linecap="round"/>
          <path d="M 0,-80 Q 80,-160 30,-260" stroke="url(#ice)" stroke-width="20" fill="none" stroke-linecap="round"/>
          <line x1="0" y1="-180" x2="-45" y2="-230" stroke="url(#ice)" stroke-width="12" stroke-linecap="round"/>
          <line x1="0" y1="-180" x2="45" y2="-230" stroke="url(#ice)" stroke-width="12" stroke-linecap="round"/>
          <circle cx="0" cy="-285" r="14" fill="#bae6fd"/>
        </g>
      </g>
    </g>
    <!-- Static hub -->
    <g transform="scale(0.42)">
      <circle cx="0" cy="0" r="50" fill="#0f2b3c" stroke="url(#ice)" stroke-width="10"/>
      <circle cx="0" cy="0" r="22" fill="url(#ice)"/>
      <circle cx="0" cy="0" r="8" fill="#e0f2fe">
        <animate attributeName="opacity" values="1;0.55;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="350" y="170" font-size="92" font-weight="800" fill="url(#frost)" filter="url(#textGlow)" letter-spacing="-2">ChillMac</text>
    <text x="354" y="208" font-size="22" font-weight="500" fill="#7dd3fc" opacity="0.92" letter-spacing="0.4">Stay cool, stay fast.</text>
    <text x="354" y="240" font-size="12" font-weight="600" fill="#5b8fa3" opacity="0.85" letter-spacing="3.5">FREE  ·  OPEN SOURCE  ·  macOS 13+</text>
  </g>

  <!-- Live stats card -->
  <g transform="translate(840, 60)" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="320" height="200" rx="16" fill="#0a1e2e" fill-opacity="0.72" stroke="#2a5a6a" stroke-width="1"/>

    <!-- Tiny spinning fan icon (header) -->
    <g transform="translate(30, 38)">
      <circle r="13" fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.5"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
        <path d="M 0,-9 Q 5,-4 0,0 Q -5,-4 0,-9 Z" fill="#7dd3fc"/>
        <path d="M 9,0 Q 4,5 0,0 Q 4,-5 9,0 Z" fill="#7dd3fc"/>
        <path d="M 0,9 Q -5,4 0,0 Q 5,4 0,9 Z" fill="#7dd3fc"/>
        <path d="M -9,0 Q -4,-5 0,0 Q -4,5 -9,0 Z" fill="#7dd3fc"/>
      </g>
      <circle r="2" fill="#e0f2fe"/>
    </g>
    <text x="55" y="42" font-size="11" font-weight="700" fill="#7dd3fc" opacity="0.85" letter-spacing="2.4">FAN SPEED</text>

    <!-- RPM ticker (5 stacked text elements, discrete opacity swap) -->
    <g>
      <text x="30" y="85" font-size="42" font-weight="700" fill="#e0f2fe" opacity="0">2140<animate attributeName="opacity" values="1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8" calcMode="discrete" dur="4s" repeatCount="indefinite"/></text>
      <text x="30" y="85" font-size="42" font-weight="700" fill="#e0f2fe" opacity="0">2186<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8" calcMode="discrete" dur="4s" repeatCount="indefinite"/></text>
      <text x="30" y="85" font-size="42" font-weight="700" fill="#e0f2fe" opacity="0">2152<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8" calcMode="discrete" dur="4s" repeatCount="indefinite"/></text>
      <text x="30" y="85" font-size="42" font-weight="700" fill="#e0f2fe" opacity="0">2168<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8" calcMode="discrete" dur="4s" repeatCount="indefinite"/></text>
      <text x="30" y="85" font-size="42" font-weight="700" fill="#e0f2fe" opacity="0">2144<animate attributeName="opacity" values="0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8" calcMode="discrete" dur="4s" repeatCount="indefinite"/></text>
    </g>
    <text x="172" y="85" font-size="16" font-weight="600" fill="#7dd3fc" opacity="0.6" letter-spacing="1">RPM</text>

    <!-- Divider -->
    <line x1="30" y1="108" x2="290" y2="108" stroke="#2a5a6a" stroke-width="1" opacity="0.5"/>

    <!-- Thermometer icon -->
    <g transform="translate(36, 132)">
      <path d="M 0,-8 Q -4,-8 -4,-3 L -4,4 Q -7,6 -7,10 Q -7,14 -3,14 Q 1,14 1,10 Q 1,6 -2,4 L -2,-3 Q -2,-6 0,-6 Z" fill="#7dd3fc" opacity="0.85"/>
    </g>
    <text x="55" y="136" font-size="11" font-weight="700" fill="#7dd3fc" opacity="0.85" letter-spacing="2.4">CPU TEMP</text>

    <!-- Gauge -->
    <rect x="30" y="150" width="260" height="9" rx="4.5" fill="#1a3a4a"/>
    <rect x="30" y="150" width="220" height="9" rx="4.5" fill="url(#tempBar)">
      <animate attributeName="width" values="220;100;220" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- Temperature ticker -->
    <g>
      <text x="30" y="184" font-size="22" font-weight="600" fill="#fca5a5" opacity="0">68°<animate attributeName="opacity" values="1;0;0;0;0;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
      <text x="30" y="184" font-size="22" font-weight="600" fill="#fcd34d" opacity="0">58°<animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
      <text x="30" y="184" font-size="22" font-weight="600" fill="#facc15" opacity="0">48°<animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
      <text x="30" y="184" font-size="22" font-weight="600" fill="#7dd3fc" opacity="0">38°<animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
      <text x="30" y="184" font-size="22" font-weight="600" fill="#facc15" opacity="0">48°<animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
      <text x="30" y="184" font-size="22" font-weight="600" fill="#fcd34d" opacity="0">58°<animate attributeName="opacity" values="0;0;0;0;0;1" keyTimes="0;0.166;0.333;0.5;0.666;0.833" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
    </g>
    <text x="100" y="184" font-size="12" fill="#7dd3fc" opacity="0.65" letter-spacing="0.6">cooling…</text>
  </g>
</svg>
