<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="ChillMac. Stay cool, stay fast.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12253c"/>
      <stop offset="1" stop-color="#0a1424"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#162c46"/>
      <stop offset="1" stop-color="#08101e"/>
    </linearGradient>
    <linearGradient id="ice" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0" stop-color="#5BE3F0"/>
      <stop offset="1" stop-color="#30D158"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#40C8E0" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#40C8E0" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#40C8E0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <!-- The fan mark from the app icon: three blades around a ringed hub, in a 100x100 box. -->
    <path id="blade" d="M46.5,41 C37,30 38,12 52,7 C64,3 75,12 70.5,22 C67,30 60,34 56,42 Z"/>
    <g id="blades">
      <use href="#blade"/>
      <use href="#blade" transform="rotate(120 50 50)"/>
      <use href="#blade" transform="rotate(240 50 50)"/>
    </g>
    <path id="hub" fill-rule="evenodd" d="M41,50 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0 Z M46.5,50 a3.5,3.5 0 1,1 7,0 a3.5,3.5 0 1,1 -7,0 Z"/>
    <!-- The fan rows' glyph, after SF Symbols' fan.fill: four rounded blades, ringed hub. -->
    <path id="rowBlade" d="M53,41 C42,40 30,30 33,17 C36,5 56,1 65,9 C74,17 68,31 59,40 Z"/>
    <symbol id="fan" viewBox="0 0 100 100" overflow="visible">
      <use href="#rowBlade"/>
      <use href="#rowBlade" transform="rotate(90 50 50)"/>
      <use href="#rowBlade" transform="rotate(180 50 50)"/>
      <use href="#rowBlade" transform="rotate(270 50 50)"/>
      <circle cx="50" cy="50" r="10"/>
      <circle cx="50" cy="50" r="5" fill="none" stroke="#0f1f33" stroke-width="2.6"/>
    </symbol>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
  <circle cx="150" cy="160" r="170" fill="url(#glow)"/>

  <!-- App icon -->
  <g transform="translate(66 76) scale(1.68)">
    <rect x="4" y="4" width="92" height="92" rx="21" fill="url(#tile)"/>
    <rect x="4.5" y="4.5" width="91" height="91" rx="20.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    <g transform="translate(50 50) scale(.66) translate(-50 -50)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="6s" repeatCount="indefinite"/>
        <use href="#blades" fill="url(#ice)" fill-opacity="0.28" transform="rotate(-28 50 50)"/>
        <use href="#blades" fill="url(#ice)" fill-opacity="0.5" transform="rotate(-14 50 50)"/>
        <use href="#blades" fill="url(#ice)"/>
      </g>
      <use href="#hub" fill="url(#ice)"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="262" y="148" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1.5">ChillMac</text>
  <text x="264" y="188" font-size="26" font-weight="600" fill="#40C8E0">Stay cool, stay fast.</text>
  <text x="264" y="224" font-size="16" fill="#ffffff" fill-opacity="0.55">Fan control and system stats in your menu bar.</text>
  <g transform="translate(264 244)">
    <rect width="66" height="26" rx="13" fill="#ffffff" fill-opacity="0.08"/>
    <text x="33" y="18" font-size="13" font-weight="700" fill="#ffffff" fill-opacity="0.8" text-anchor="middle">v2.0</text>
    <rect x="76" width="168" height="26" rx="13" fill="#ffffff" fill-opacity="0.08"/>
    <text x="160" y="18" font-size="13" font-weight="600" fill="#ffffff" fill-opacity="0.8" text-anchor="middle">Free and open source</text>
  </g>

  <!-- Popover mock-up -->
  <g transform="translate(700 22)" filter="url(#shadow)">
    <rect width="450" height="276" rx="18" fill="#0f1f33"/>
    <rect x="0.5" y="0.5" width="449" height="275" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

    <!-- Header -->
    <text x="22" y="34" font-size="12" fill="#ffffff" fill-opacity="0.5">MacBook Pro · M3 Max</text>
    <text x="22" y="60" font-size="22" font-weight="700" fill="#ffffff">Running cool</text>
    <text x="22" y="81" font-size="13" fill="#ffffff" fill-opacity="0.6">Smart cooling is keeping the fans quiet.</text>

    <!-- Temperature badge -->
    <g transform="translate(318 18)">
      <rect width="112" height="66" rx="12" fill="#ffffff" fill-opacity="0.06"/>
      <path d="M22,16 a4,4 0 0,1 8,0 v14 a7,7 0 1,1 -8,0 Z" fill="none" stroke="#30D158" stroke-width="2.2"/>
      <circle cx="26" cy="36" r="3.2" fill="#30D158"/>
      <g font-size="24" font-weight="800" fill="#30D158">
        <text x="40" y="38" opacity="1">52.5°<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.33;0.66" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
        <text x="40" y="38" opacity="0">53.1°<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.33;0.66" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
        <text x="40" y="38" opacity="0">52.8°<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.33;0.66" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
      </g>
      <text x="98" y="56" font-size="11" fill="#ffffff" fill-opacity="0.5" text-anchor="end">Hottest sensor ›</text>
    </g>

    <!-- Cooling -->
    <text x="22" y="114" font-size="11" font-weight="700" fill="#ffffff" fill-opacity="0.45" letter-spacing="1.6">COOLING</text>
    <g transform="translate(20 124)">
      <rect width="410" height="34" rx="9" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="138" y="2" width="134" height="30" rx="7" fill="#ffffff" fill-opacity="0.18"/>
      <text x="69" y="22" font-size="14" font-weight="600" fill="#ffffff" fill-opacity="0.65" text-anchor="middle">Automatic</text>
      <path d="M182,9 l-7,10 h5 l-2,7 l8,-11 h-5 l2,-6 Z" fill="#FF9F0A"/>
      <text x="191" y="22" font-size="14" font-weight="700" fill="#FF9F0A">Smart</text>
      <text x="341" y="22" font-size="14" font-weight="600" fill="#ffffff" fill-opacity="0.65" text-anchor="middle">Manual</text>
    </g>

    <!-- Fans -->
    <rect x="20" y="170" width="410" height="92" rx="12" fill="#ffffff" fill-opacity="0.05"/>
    <line x1="20" y1="216" x2="430" y2="216" stroke="#ffffff" stroke-opacity="0.08"/>

    <g transform="translate(48 193)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
        <use href="#fan" x="-15" y="-15" width="30" height="30" fill="#30D158"/>
      </g>
    </g>
    <text x="72" y="189" font-size="15" font-weight="700" fill="#ffffff">Left Fan</text>
    <text x="72" y="206" font-size="12" fill="#FF9F0A">Smart cooling · 24%</text>
    <g font-size="22" font-weight="800" fill="#30D158" text-anchor="end">
      <text x="372" y="201" opacity="1">2,180<animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="4s" repeatCount="indefinite"/></text>
      <text x="372" y="201" opacity="0">2,210<animate attributeName="opacity" values="0;1" keyTimes="0;0.5" calcMode="discrete" dur="4s" repeatCount="indefinite"/></text>
    </g>
    <text x="378" y="201" font-size="11" font-weight="600" fill="#ffffff" fill-opacity="0.5">RPM</text>

    <g transform="translate(48 239)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
        <use href="#fan" x="-15" y="-15" width="30" height="30" fill="#30D158"/>
      </g>
    </g>
    <text x="72" y="235" font-size="15" font-weight="700" fill="#ffffff">Right Fan</text>
    <text x="72" y="252" font-size="12" fill="#FF9F0A">Smart cooling · 26%</text>
    <g font-size="22" font-weight="800" fill="#30D158" text-anchor="end">
      <text x="372" y="247" opacity="1">2,340<animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="4s" begin="-1s" repeatCount="indefinite"/></text>
      <text x="372" y="247" opacity="0">2,310<animate attributeName="opacity" values="0;1" keyTimes="0;0.5" calcMode="discrete" dur="4s" begin="-1s" repeatCount="indefinite"/></text>
    </g>
    <text x="378" y="247" font-size="11" font-weight="600" fill="#ffffff" fill-opacity="0.5">RPM</text>
  </g>
</svg>
