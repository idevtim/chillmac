name: ChillMac
options:
  bundleIdPrefix: com.idevtim
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  ChillMac:
    type: application
    platform: macOS
    sources:
      - path: ChillMac
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Fan Sooner
        PRODUCT_MODULE_NAME: ChillMac
        PRODUCT_BUNDLE_IDENTIFIER: com.idevtim.ChillMac
        INFOPLIST_FILE: ChillMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: ChillMac/ChillMac.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: com.idevtim.ChillMac.Helper
        embed: false
        codeSign: false
    postCompileScripts:
      # inputFiles required so User Script Sandboxing can read the helper product
      - name: "Copy Helper Tool"
        script: |
          mkdir -p "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/HelperTools"
          mkdir -p "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons"
          cp "${BUILT_PRODUCTS_DIR}/com.idevtim.ChillMac.Helper" "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/HelperTools/"
          cp "${SRCROOT}/FanControlHelper/Launchd.plist" "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons/com.idevtim.ChillMac.Helper3.plist"
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/com.idevtim.ChillMac.Helper"
          - "$(SRCROOT)/FanControlHelper/Launchd.plist"
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/Library/HelperTools/com.idevtim.ChillMac.Helper"
          - "$(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/com.idevtim.ChillMac.Helper3.plist"

  ChillMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ChillMacTests
    dependencies:
      - target: ChillMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idevtim.ChillMacTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/../Frameworks"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Fan Sooner.app/Contents/MacOS/Fan Sooner"
        BUNDLE_LOADER: "$(TEST_HOST)"

  com.idevtim.ChillMac.Helper:
    type: tool
    platform: macOS
    sources:
      - path: FanControlHelper
      - path: Shared
      - path: ChillMac/SMC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idevtim.ChillMac.Helper
        PRODUCT_NAME: com.idevtim.ChillMac.Helper
        INFOPLIST_FILE: FanControlHelper/Info.plist
        CODE_SIGN_ENTITLEMENTS: FanControlHelper/Helper.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_OTHER_PREPROCESSOR_FLAGS: ""
        OTHER_LDFLAGS: "-sectcreate __TEXT __launchd_plist $(SRCROOT)/FanControlHelper/Launchd.plist"

schemes:
  ChillMac:
    build:
      targets:
        ChillMac: all
        ChillMacTests: [test]
    test:
      targets:
        - name: ChillMacTests
          parallelizable: true
      testPlans:
        - path: TestPlans/Unit.xctestplan
          defaultPlan: true
